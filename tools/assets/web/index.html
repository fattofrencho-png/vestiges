<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Studio</title>
<style>
  :root { --bg:#17181c; --panel:#212228; --raised:#2b2d35; --line:#3a3c46; --text:#ececec; --dim:#a8aab4; --ok:#6fbf5a; --bad:#e0706a; --warn:#e0b050; --accent:#c9a45c; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,"Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header b { color:var(--accent); }
  #steps { display:flex; gap:4px; flex:1; justify-content:center; flex-wrap:wrap; }
  #steps span { padding:3px 12px; border-radius:12px; color:var(--dim); font-size:13px; }
  #steps span.done { color:var(--ok); }
  #steps span.now { background:var(--accent); color:#17181c; font-weight:600; }
  main { flex:1; min-height:0; display:flex; overflow:auto; }
  .page { width:100%; max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 6px; } h2 { font-size:14px; margin:18px 0 6px; color:var(--dim); font-weight:600; }
  p { margin:6px 0; } .dim { color:var(--dim); font-size:13px; }
  button, select, input, textarea { font:inherit; color:var(--text); }
  button { background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:7px 14px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.main { background:var(--accent); border-color:var(--accent); color:#17181c; font-weight:600; }
  button.good { background:var(--ok); border-color:var(--ok); color:#10110f; font-weight:600; }
  button.danger { color:var(--bad); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  textarea, input[type=text], input[type=password], input[type=number], select { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:7px 9px; }
  textarea { width:100%; min-height:90px; resize:vertical; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .row .grow { flex:1; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:6px; }
  .cards button { text-align:left; padding:10px; }
  .q { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-top:10px; }
  .q label.opt, label.opt { display:block; padding:2px 0; }
  label.field { display:block; margin-top:10px; font-size:13px; color:var(--dim); }
  label.field input, label.field select, label.field textarea { display:block; width:100%; margin-top:3px; color:var(--text); font-size:15px; }
  .home { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  .home button { padding:18px; text-align:left; }
  .home button b { display:block; font-size:17px; margin-bottom:4px; }
  .home button.first { border-color:var(--accent); }
  .drop { border:2px dashed var(--line); border-radius:8px; padding:20px; text-align:center; margin-top:10px; }
  .drop.over { border-color:var(--accent); background:var(--raised); }
  .ticks { max-height:320px; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin-top:6px; font-size:13px; }
  .ticks label { display:block; padding:1px 0; }
  .ticks .group { color:var(--accent); font-weight:600; margin-top:6px; }
  .bar { height:10px; border-radius:5px; background:var(--raised); overflow:hidden; margin:10px 0; }
  .bar div { height:100%; background:var(--accent); }
  .wide { max-width:1100px; }
  .lib { width:100%; font-size:13px; margin-top:10px; }
  .lib th { text-align:left; color:var(--dim); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line); }
  .lib td, .lib td:last-child { text-align:left; padding:4px 6px; border-bottom:1px solid var(--raised); vertical-align:top; }
  .lib tr:hover td { background:var(--panel); }
  .lib .name { word-break:break-all; }
  .queue { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:8px; margin-bottom:10px; background:var(--raised); border-radius:6px; }
  .name-box { width:100%; font-size:12px !important; }
  #side details.sec { border-top:1px solid var(--line); margin-top:10px; padding-top:2px; }
  #side details.sec > summary { font-size:14px; font-weight:600; color:var(--dim); margin:8px 0 6px; }
  #side details.sec[open] > summary { margin-bottom:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:12px; margin-top:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; min-width:0; }
  .card .thumb { display:flex; justify-content:center; background:rgba(127,127,127,.12); border-radius:6px; }
  .card img { width:100%; max-width:160px; height:auto; aspect-ratio:1; object-fit:contain; }
  .cardbar { display:flex; align-items:center; gap:6px; margin:6px 0 2px; }
  .cardname { display:block; color:inherit; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .preset-grid { display:grid; grid-template-columns:minmax(240px,360px) 1fr; gap:20px; align-items:start; }
  .preset-grid input[type=range] { padding:0; }
  @media (max-width:860px) { .preset-grid { grid-template-columns:1fr; } }
  .rv-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .rv-count { margin:8px 0 2px; }
  .rv-main { display:grid; grid-template-columns:minmax(280px,440px) 1fr; gap:24px; margin-top:12px; align-items:start; }
  @media (max-width:900px) { .rv-main { grid-template-columns:1fr; } }
  .rv-pic { width:100%; max-width:400px; aspect-ratio:1; object-fit:contain; background:rgba(127,127,127,.12); border-radius:8px; image-rendering:auto; }
  .rv-row { display:grid; grid-template-columns:20px 90px 1fr; gap:8px; padding:7px 0; border-bottom:1px solid var(--raised); align-items:start; }
  .rv-row select { min-width:170px; }
  .rv-text { flex:1; min-width:0; font-size:14px; padding:5px 8px; }
  .rv-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:6px 12px; margin:10px 0; }
  .rv-cell { padding:4px 8px 6px; border-radius:6px; border-left:3px solid transparent; background:rgba(127,127,127,.07); }
  .rv-cell.low { border-left-color:var(--warn); }
  .rv-cell.wide { grid-column:1/-1; }
  .rv-lab { color:var(--dim); font-size:12px; text-transform:capitalize; display:flex; gap:6px; align-items:center; }
  .rv-ctl { display:flex; align-items:center; gap:4px; }
  .rv-ctl select { flex:1; min-width:0; }
  .rv-fileblock { margin:8px 0; }
  .rv-actions { position:sticky; bottom:0; background:var(--bg); padding:6px 0 4px; border-top:1px solid var(--line); z-index:5; }
  .rv-rule { display:flex; gap:8px; align-items:flex-start; margin:4px 0; font-size:12px; }
  .rv-rule code { display:block; margin-top:2px; }
  .rv-file { display:inline-block; word-break:break-all; background:rgba(127,127,127,.15); padding:3px 6px; border-radius:4px; }
  .rv-3d { position:relative; width:100%; aspect-ratio:4/3; max-height:46vh; border-radius:8px; overflow:hidden; background:rgba(127,127,127,.12); margin:6px 0; }
  .rv-3d #view { position:absolute; inset:0; min-height:0; }
  .rv-3d #walk { display:none; }
  .rv-3d #bar { top:6px; left:6px; right:6px; gap:5px; }
  .rv-3d #bar > * { font-size:12px; padding:3px 6px; }
  button.on { border-color:var(--accent,#d4a24a); }
  .rv-name { color:var(--dim); text-transform:capitalize; padding-top:6px; }
  .rv-mini { padding:1px 7px !important; margin-left:4px; font-size:12px; }
  .rv-state { margin-bottom:6px; }
  .rv-rels { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 10px; }
  .rv-rel { display:block; font-size:11px; color:inherit; text-decoration:none; width:72px; }
  .rv-rel img { width:64px; height:64px; background:rgba(127,127,127,.12); border-radius:4px; }
  .rv-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50; }
  .rv-dialog { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:20px; max-width:560px; }
  .rv-dialog img { width:64px; height:64px; border-radius:4px; background:rgba(127,127,127,.12); }
  kbd { background:var(--raised); border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:12px; color:var(--dim); }
  .focus-list { display:grid; gap:8px; margin-top:6px; }
  button.focus { text-align:left; padding:12px 14px; display:block; width:100%; }
  button.focus b { display:block; font-size:15px; }
  button.focus.first { border-color:var(--accent); }
  .dash { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:700px) { .dash { grid-template-columns:1fr; } }
  .stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin-top:8px; }
  button.stat, div.stat { text-align:left; padding:8px 10px; background:var(--raised); border:1px solid var(--line); border-radius:6px; }
  .stat b { display:block; font-size:18px; }
  .cov { margin:8px 0; } .cov.total { margin-top:12px; font-weight:600; }
  .cov-head { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .cov-head a { color:inherit; min-width:140px; white-space:pre; } .cov .bar { height:6px; margin:3px 0; }
  details summary { cursor:pointer; color:var(--dim); font-size:14px; font-weight:600; margin-top:14px; }
  .tabs { display:flex; gap:6px; margin:14px 0 4px; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#17181c; font-weight:600; }
  .corners { display:grid; grid-template-columns:auto 1fr 1fr 1fr; gap:6px; align-items:center; margin-top:6px; }
  .corners input { width:100%; }
  .tool { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .tool input[type=number] { width:68px; }
  .tool select, .tool input[type=text] { flex:1; min-width:100px; }
  #side button { padding:5px 10px; font-size:13px; }
  #side select, #side input { font-size:13px; padding:5px 6px; }
  .tag { font-size:11px; padding:1px 7px; border-radius:9px; margin-left:8px; background:var(--raised); color:var(--dim); }
  .tag.req { background:var(--accent); color:#17181c; }
  .notice { border-radius:8px; padding:10px 14px; margin:10px 0; background:var(--panel); border-left:3px solid var(--accent); }
  .notice.bad { border-color:var(--bad); }
  ul { margin:4px 0; padding-left:20px; }
  .good-t { color:var(--ok); } .bad-t { color:var(--bad); } .warn-t { color:var(--warn); }
  .list-item { display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-top:8px; }
  .list-item .grow { flex:1; min-width:200px; }
  #stage { flex:1; display:none; min-width:0; min-height:0; }
  #stage.on { display:grid; grid-template-columns:1fr 340px; }
  #view { position:relative; min-width:0; min-height:300px; }
  canvas { display:block; width:100%; height:100%; }
  #bar { position:absolute; top:10px; left:10px; right:10px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none; }
  #bar > * { pointer-events:auto; background:rgba(23,24,28,.88); font-size:13px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; }
  #help { position:absolute; left:10px; bottom:10px; background:rgba(23,24,28,.8); padding:4px 8px; border-radius:5px; font-size:12px; color:var(--dim); }
  #side { background:var(--panel); border-left:1px solid var(--line); padding:14px; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td { padding:2px 0; } td:last-child { text-align:right; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite; vertical-align:-2px; margin-right:8px; }
  @keyframes s { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .spin { animation:none; } }
  @media (max-width:860px) { #stage.on { grid-template-columns:1fr; grid-template-rows:60vh auto; } #side { border-left:0; } main { display:block; } }
</style>
</head>
<body>
<header>
  <b>Asset Studio</b>
  <div id="steps" aria-label="Steps"></div>
  <button id="homeBtn" title="Where things stand and what to do next">Dashboard</button>
  <button id="newBtn">New</button>
  <button id="exploreBtn" title="Open any .zip or .jar and see what is inside">Look inside</button>
  <button id="findBtn">Find online</button>
  <button id="reviewBtn" title="Check what the analyser found, one build at a time">Review</button>
  <button id="libraryBtn">Library</button>
  <button id="settingsBtn">Settings</button>
</header>
<main>
  <div id="page" class="page"></div>
  <div id="stage">
    <div id="view">
      <canvas id="canvas" tabindex="0"></canvas>
      <div id="bar">
        <select id="biome" aria-label="Biome colours">
          <option value="forest">Forest</option><option value="dark_forest">Dark forest</option><option value="plains">Plains</option>
          <option value="taiga">Taiga</option><option value="jungle">Jungle</option><option value="swamp">Swamp</option><option value="savanna">Savanna</option>
        </select>
        <select id="time" aria-label="Time of day"><option value="day">Day</option><option value="sunset">Sunset</option><option value="night">Night</option></select>
        <label><input type="checkbox" id="showPlayer" checked> Player</label>
        <label><input type="checkbox" id="showOak" checked> Vanilla oak</label>
        <button id="walk">Walk</button>
        <button id="reset">Reset view</button>
      </div>
      <div id="help"></div>
    </div>
    <aside id="side"></aside>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
