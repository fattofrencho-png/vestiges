<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vestiges Wiki</title>
<style>
/* Layout: a fixed index down the left and one reading column, like a catalogue in an old vault. Tuff greys, oxidised copper. */
:root {
  --bg: #E7E8E3; --panel: #DADCD5; --paper: #F3F3EE; --ink: #1E2220; --muted: #5B635E; --line: #C2C6BE;
  --accent: #1F7A6C; --accent-ink: #FFFFFF; --copper: #A4582B; --truth: #7A2A45; --gap: #8A5A00;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --mono: Consolas, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15191A; --panel: #101415; --paper: #1D2223; --ink: #E2E5E0; --muted: #98A29C; --line: #2F3738;
    --accent: #58C4B2; --accent-ink: #0C1716; --copper: #D88F5E; --truth: #E58CA6; --gap: #E0B25C;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); min-height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 1.1rem 1rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
.brand { font-family: var(--serif); font-size: 1.45rem; font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: .01em; }
.brand small { display: block; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--copper); font-weight: 400; }
#q { width: 100%; padding: .5rem .6rem; background: var(--paper); border: 1px solid var(--line); border-radius: 3px; color: var(--ink); font: inherit; font-size: .92rem; }
.state { display: flex; flex-direction: column; gap: .4rem; font-size: .82rem; color: var(--muted); }
.state strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 4px; background: var(--line); }
.meter i { display: block; height: 100%; background: var(--copper); width: 0; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.confirm { background: var(--paper); border: 1px solid var(--line); padding: .6rem; display: flex; flex-direction: column; gap: .5rem; color: var(--ink); }
.confirm div { display: flex; gap: .5rem; flex-wrap: wrap; }
.btn { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); padding: .25rem .6rem; border-radius: 3px; cursor: pointer; font: inherit; font-size: .82rem; }
.btn.alt { background: none; color: var(--ink); border-color: var(--line); }
.navg { display: flex; flex-direction: column; gap: 1px; }
.navh { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--copper); margin-bottom: .3rem; }
.navg a { color: var(--ink); text-decoration: none; padding: .22rem .45rem; font-size: .92rem; border-left: 2px solid transparent; }
.navg a:hover { color: var(--accent); }
.navg a.on { border-left-color: var(--copper); background: var(--paper); font-weight: 600; }
.menu { display: none; }

main { padding: 2.2rem max(1.25rem, 4vw) 5rem; min-width: 0; }
.page, #results { max-width: 44rem; margin: 0 auto; }
h1 { font-family: var(--serif); font-size: 2.2rem; line-height: 1.15; font-weight: 600; margin: 0 0 .9rem; text-wrap: balance; }
h2 { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; margin: 2.2rem 0 .7rem; padding-bottom: .25rem; border-bottom: 1px solid var(--line); text-wrap: balance; }
h3 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .35rem; }
p { margin: 0 0 .65rem; }
.lead { font-size: 1.08rem; color: var(--muted); }
.entry { padding: 1rem 0; border-top: 1px solid var(--line); scroll-margin-top: 1rem; }
h2 + .entry, h2 + .lk .entry { border-top: 0; padding-top: .2rem; }
.entry:target h3, .lk:target h3 { color: var(--accent); }
.entry > :last-child { margin-bottom: 0; }
ul, ol { margin: 0 0 .7rem; padding-left: 1.35rem; }
.tw { overflow-x: auto; margin: 0 0 .8rem; }
table { border-collapse: collapse; width: 100%; font-size: .94rem; }
th { text-align: left; font-weight: 600; font-size: .8rem; color: var(--muted); }
th, td { padding: .3rem .7rem .3rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
blockquote.bible { margin: 0 0 .55rem; padding: .05rem 0 .05rem .85rem; border-left: 2px solid var(--copper); font-family: var(--serif); }
.seen { color: var(--muted); font-size: .9rem; }

.lv { margin: 0 0 .5rem; }
.lv p { font-family: var(--serif); font-size: 1.04rem; margin: 0 0 .2rem; }
.lvl { display: block; font-family: var(--mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lv-c p { color: var(--muted); font-size: .97rem; }
.lv-L1 .lvl { color: var(--accent); }
.lv-L2 .lvl { color: var(--copper); }
.lv-L3 .lvl { color: var(--truth); }

.lk-closed { color: var(--muted); font-size: .88rem; }
.lk-entry.lk-closed, .lk-block.lk-closed { padding: .55rem 0; border-top: 1px solid var(--line); }
.lk-truth.lk-closed, .lk-frag.lk-closed { padding: .1rem 0; }
.lk-closed::before { content: ""; display: inline-block; width: .55em; height: .55em; margin-right: .5em; background: var(--line); outline: 1px solid var(--muted); outline-offset: 1px; }
.tag { display: block; width: fit-content; font-family: var(--mono); font-size: .66rem; color: var(--truth); letter-spacing: .04em; margin: .35rem 0 .15rem; }
.lk-name .tag { display: none; }

.frag { margin: 0 0 .85rem; }
.ftitle { display: block; font-size: .85rem; font-weight: 600; }
.ftext { display: block; font-family: var(--serif); font-size: 1.04rem; }
.fnote, .fwriter { display: block; font-size: .85rem; color: var(--muted); }
.gap { color: var(--gap); font-size: .9rem; font-style: italic; }
.anote { background: var(--panel); border: 1px dashed var(--line); padding: .5rem .7rem; margin: .5rem 0; font-size: .92rem; }
.anote p { margin: 0 0 .3rem; font-family: var(--sans); }
.alabel { display: block; font-family: var(--mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--copper); }

.names { display: flex; flex-direction: column; }
.nm { display: grid; grid-template-columns: 13rem 6.5rem minmax(0, 1fr); gap: .15rem .7rem; padding: .32rem 0; border-bottom: 1px solid var(--line); font-size: .94rem; }
.nm a { font-weight: 600; text-decoration: none; }
.nk { font-family: var(--mono); font-size: .72rem; color: var(--muted); padding-top: .15rem; }
.lk-name.lk-closed { display: none; }
#names-hidden { color: var(--muted); font-size: .9rem; }

.doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; margin-top: 1.2rem; }
.doors a { background: var(--paper); border: 1px solid var(--line); padding: .7rem .8rem; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; }
.doors a:hover { border-color: var(--accent); }
.doors strong { font-family: var(--serif); font-size: 1.1rem; font-weight: 600; }
.doors span { color: var(--muted); font-size: .88rem; }

.res { display: block; padding: .6rem 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.res strong { color: var(--accent); }
.res small { color: var(--muted); font-size: .78rem; display: block; }
.res span { font-size: .9rem; color: var(--muted); }
mark { background: var(--accent); color: var(--accent-ink); padding: 0 .1em; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .menu { display: block; }
  .navwrap:not(.open) { display: none; }
  .nm { grid-template-columns: minmax(0, 1fr) auto; }
  .nl { grid-column: 1 / -1; color: var(--muted); }
  .doors { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 1.8rem; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#home"><small>Offline wiki</small>Vestiges</a>
    <input id="q" type="search" placeholder="Search names and places" aria-label="Search the wiki" autocomplete="off">
    <div class="state" id="state"></div>
    <button class="link-btn menu" id="menu" type="button" aria-expanded="false">Show the contents</button>
    <nav class="navwrap" id="navwrap"><div style="display:flex;flex-direction:column;gap:1rem"><!--NAV--></div></nav>
  </aside>
  <main>
    <div id="results" hidden></div>
    <div id="pages"><!--PAGES--></div>
  </main>
</div>
<script src="progress.js"></script>
<script>
(function () {
  var AUTHOR = /*AUTHOR*/false;
  var KEY = new TextEncoder().encode("/*KEY*/");
  var P = window.VESTIGES_PROGRESS || null;
  var dragons = P && +P.dragons ? +P.dragons : 0;
  var found = {};
  ((P && P.found) || []).forEach(function (f) { found[f] = 1; });
  var player = P && P.player ? String(P.player) : "";
  var dec = new TextDecoder();

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }
  var showAll = AUTHOR || store("vestiges.showAll") === "1";

  function reveal(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) ^ KEY[i % KEY.length];
    var t = dec.decode(a);
    return t.replace(/\{player\}/g, player ? esc(player) : "your own name");
  }
  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function open(terms) {
    return terms.some(function (t) { return t[0] === "d" ? dragons >= +t.slice(1) : !!found[t.slice(1)]; });
  }
  function label(terms) {
    var d = terms.filter(function (t) { return t[0] === "d"; })[0];
    return d ? "Opens after dragon " + d.slice(1) : "Not found yet";
  }
  function tagText(terms) {
    var d = terms.filter(function (t) { return t[0] === "d"; })[0];
    var f = terms.some(function (t) { return t[0] === "f"; });
    return d ? "Opens at dragon " + d.slice(1) + (f ? ", or when its diary is found" : "") : "Opens when found";
  }

  var locks = [].slice.call(document.querySelectorAll(".lk"));
  function applyLocks() {
    locks.forEach(function (el) {
      var terms = el.getAttribute("data-l").split(" ");
      var earned = open(terms);
      el.hidden = false;
      el.removeAttribute("data-more");
      if (earned || showAll) {
        el.classList.remove("lk-closed");
        el.innerHTML = (earned ? "" : '<span class="tag">' + tagText(terms) + "</span>") + reveal(el.getAttribute("data-e"));
      } else {
        el.classList.add("lk-closed");
        el.textContent = label(terms);
      }
    });
    var nameBox = document.querySelector(".names"), note = document.getElementById("names-hidden");
    if (nameBox) {
      if (!note) { note = document.createElement("p"); note.id = "names-hidden"; nameBox.parentNode.insertBefore(note, nameBox); }
      var hiddenNames = nameBox.querySelectorAll(".lk-closed").length;
      note.textContent = hiddenNames + (hiddenNames === 1 ? " name is" : " names are") + " still hidden.";
      note.hidden = !hiddenNames;
    }
    // Runs of closed parts collapse into one line.
    var run = null;
    locks.forEach(function (el) {
      var prev = el.previousElementSibling;
      if (!el.classList.contains("lk-closed")) { run = null; return; }
      if (run && prev === run.last && run.text === el.textContent) {
        run.n++; run.last = el; el.hidden = true;
        run.first.textContent = run.n + " more · " + run.text;
      } else {
        run = { first: el, last: el, n: 1, text: el.textContent };
      }
    });
  }

  function drawState() {
    var box = document.getElementById("state");
    box.textContent = "";
    if (AUTHOR) { box.innerHTML = "<strong>Your copy</strong><span>Everything is open.</span>"; return; }
    if (P) {
      box.innerHTML = "<span><strong>" + dragons + " of 24</strong> dragons slain</span>" +
        '<div class="meter"><i style="width:' + Math.min(100, dragons / 24 * 100) + '%"></i></div>';
    } else {
      box.innerHTML = "<span>Open this from the game to see what you have unlocked.</span>";
    }
    var b = document.createElement("button");
    b.className = "link-btn"; b.type = "button"; b.id = "all";
    b.textContent = showAll ? "Hide what I haven't earned" : "Show everything";
    b.addEventListener("click", function () {
      if (showAll) { setAll(false); return; }
      var c = document.createElement("div");
      c.className = "confirm";
      c.innerHTML = "<span>This shows the whole story, including the ending. It can't be unread.</span>" +
        '<div><button class="btn" type="button" id="yes">Show everything</button><button class="btn alt" type="button" id="no">Keep it hidden</button></div>';
      box.replaceChild(c, b);
      c.querySelector("#yes").addEventListener("click", function () { setAll(true); });
      c.querySelector("#no").addEventListener("click", drawState);
    });
    box.appendChild(b);
  }
  function setAll(v) { showAll = v; store("vestiges.showAll", v ? "1" : "0"); applyLocks(); drawState(); index(); route(); }

  // Search only ever sees what is currently readable.
  var idx = [];
  function index() {
    idx = [];
    [].forEach.call(document.querySelectorAll(".page"), function (pg) {
      var title = pg.getAttribute("data-title");
      var hits = pg.querySelectorAll(".entry, .nm, .frag");
      [].forEach.call(hits, function (el) {
        var nameLink = el.classList.contains("nm") && el.querySelector("a");
        var anchor = nameLink ? nameLink.getAttribute("href").slice(1) : el.id || (el.parentElement && el.parentElement.classList.contains("lk") && el.parentElement.id) || pg.id;
        var name = el.getAttribute("data-t") || (el.querySelector("a,.ftitle") || {}).textContent || title;
        idx.push({ id: anchor, name: name, page: title, text: el.textContent, low: el.textContent.toLowerCase(), nl: name.toLowerCase() });
      });
      idx.push({ id: pg.id, name: title, page: "Page", text: (pg.querySelector("p") || {}).textContent || "", low: title.toLowerCase(), nl: title.toLowerCase() });
    });
  }
  var q = document.getElementById("q"), results = document.getElementById("results"), pagesEl = document.getElementById("pages");
  function snippet(text, term) {
    var i = text.toLowerCase().indexOf(term);
    if (i < 0) return esc(text.slice(0, 110));
    var s = Math.max(0, i - 50), e = Math.min(text.length, i + term.length + 60);
    return (s ? "… " : "") + esc(text.slice(s, i)) + "<mark>" + esc(text.slice(i, i + term.length)) + "</mark>" + esc(text.slice(i + term.length, e)) + (e < text.length ? " …" : "");
  }
  function search() {
    var term = q.value.trim().toLowerCase();
    if (term.length < 2) { results.hidden = true; pagesEl.hidden = false; return; }
    var hits = idx.filter(function (x) { return x.low.indexOf(term) >= 0; });
    hits.sort(function (a, b) { return (b.nl.indexOf(term) >= 0) - (a.nl.indexOf(term) >= 0) || (a.nl.indexOf(term) - b.nl.indexOf(term)); });
    results.innerHTML = "<h1>Search</h1><p class=\"lead\">" + hits.length + (hits.length === 1 ? " result" : " results") + " for “" + esc(q.value.trim()) + "”</p>" +
      hits.slice(0, 80).map(function (x) {
        return '<a class="res" href="#' + x.id + '"><small>' + esc(x.page) + "</small><strong>" + esc(x.name) + "</strong><br><span>" + snippet(x.text, term) + "</span></a>";
      }).join("") + (hits.length ? "" : "<p>Nothing you have unlocked matches this.</p>");
    results.hidden = false; pagesEl.hidden = true;
  }
  q.addEventListener("input", search);
  results.addEventListener("click", function (e) { if (e.target.closest("a")) { q.value = ""; results.hidden = true; pagesEl.hidden = false; setTimeout(route, 0); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === "Escape" && document.activeElement === q) { q.value = ""; search(); }
  });

  function route() {
    var id = decodeURIComponent(location.hash.slice(1)) || "home";
    var el = document.getElementById(id) || document.getElementById("home");
    var pg = el.closest(".page") || document.getElementById("home");
    results.hidden = true; pagesEl.hidden = false;
    [].forEach.call(document.querySelectorAll(".page"), function (x) { x.hidden = x !== pg; });
    [].forEach.call(document.querySelectorAll("[data-nav]"), function (a) { a.classList.toggle("on", a.getAttribute("data-nav") === pg.id); });
    document.title = pg.getAttribute("data-title") + " · Vestiges Wiki";
    if (el === pg) window.scrollTo(0, 0); else el.scrollIntoView();
    document.getElementById("navwrap").classList.remove("open");
    document.getElementById("menu").setAttribute("aria-expanded", "false");
    document.getElementById("menu").textContent = "Show the contents";
  }
  window.addEventListener("hashchange", route);
  document.getElementById("menu").addEventListener("click", function () {
    var o = document.getElementById("navwrap").classList.toggle("open");
    this.setAttribute("aria-expanded", o ? "true" : "false");
    this.textContent = o ? "Hide the contents" : "Show the contents";
  });

  applyLocks(); drawState(); index(); route();
})();
</script>
</body>
</html>
