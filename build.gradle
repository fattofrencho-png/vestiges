plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Loom adds the Minecraft and Fabric repositories itself. Vestiges depends on Fabric API only.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"vestiges" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Dev only, never in the mod jar: `dev runClientGameTest` plays through src/gametest and saves real screenshots to build/run/clientGameTest/screenshots.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "vestiges-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	// Runs tests inside Fabric's class loader, so tests can bootstrap Minecraft and decode real game data.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Release guard: the mod jar must not carry the author's wiki copy, test or run files, or anything outside the mod's own folders. Runs with `build`.
tasks.register('checkJarContents') {
	dependsOn tasks.named('jar')
	doLast {
		def jarFile = tasks.named('jar').get().archiveFile.get().asFile
		def bad = []
		zipTree(jarFile).visit { entry ->
			def path = entry.relativePath.toString()
			if (path.toLowerCase().contains('wiki-author') || path.endsWith('.log') || path.contains('node_modules') || path.startsWith('run/') || path.startsWith('docs/')) {
				bad << path
			}
		}
		if (!bad.isEmpty()) {
			throw new GradleException("The mod jar contains files that must not ship: " + bad.take(10))
		}
		logger.lifecycle("Jar contents checked: no author wiki, logs or run files in " + jarFile.name)
	}
}
tasks.named('build') { dependsOn tasks.named('checkJarContents') }
